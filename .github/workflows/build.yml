name: build

# 릴리스할 때만 빌드: "v버전" 태그를 올리거나 직접 실행할 때
# (pull_request로는 실행되지 않으므로 외부인의 풀 리퀘스트가 Secrets를 쓸 수 없음)
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TD_COMMIT: 4c6377aa7386c39217878a9a56d581922ad37ca4
  NDK_VER: 23.2.8568313

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: TDLib 캐시 불러오기
        id: tdcache
        uses: actions/cache/restore@v4
        with:
          path: tdlib-out
          key: tdlib-${{ env.TD_COMMIT }}-arm64-api24-v1

      # 텔레그램 공식 라이브러리를 직접 빌드 (처음 한 번만, 이후는 캐시 사용)
      - name: TDLib 빌드
        if: steps.tdcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf php-cli
          git clone https://github.com/tdlib/td.git td
          cd td
          git checkout "$TD_COMMIT"
          cd example/android
          ./fetch-sdk.sh SDK "$NDK_VER"
          ./build-openssl.sh SDK "$NDK_VER"
          ./build-tdlib.sh SDK "$NDK_VER" '' c++_static Java 24 arm64-v8a
          mkdir -p "$GITHUB_WORKSPACE/tdlib-out/libs" "$GITHUB_WORKSPACE/tdlib-out/java"
          cp tdlib/libs/arm64-v8a/libtdjni.so "$GITHUB_WORKSPACE/tdlib-out/libs/"
          cp -r tdlib/java/. "$GITHUB_WORKSPACE/tdlib-out/java/"

      - name: TDLib 캐시 저장
        if: steps.tdcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tdlib-out
          key: tdlib-${{ env.TD_COMMIT }}-arm64-api24-v1

      - name: TDLib를 앱에 넣기
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp tdlib-out/libs/libtdjni.so app/src/main/jniLibs/arm64-v8a/
          cp -r tdlib-out/java/. app/src/main/java/
          find app/src/main/java/org -name '*.java'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      # 서명 키는 GitHub Secrets에서만 꺼내 임시 폴더에 풀고, 로그에는 찍지 않음
      - name: 서명 키 준비
        env:
          TG_KEYSTORE_B64: ${{ secrets.TG_KEYSTORE_B64 }}
        run: |
          if [ -z "$TG_KEYSTORE_B64" ]; then echo "::error::TG_KEYSTORE_B64 Secret이 없습니다"; exit 1; fi
          printf '%s' "$TG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TG_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK 빌드
        env:
          TG_KEY_PASSWORD: ${{ secrets.TG_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease
          mkdir -p out
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "APP_VER=$V" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "out/telegram-gallery-$V.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: 릴리스 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 텔레그램 갤러리 ${{ env.APP_VER }}
          files: out/*.apk
