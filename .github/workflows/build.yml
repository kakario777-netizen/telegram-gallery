name: build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  TD_COMMIT: 4c6377aa7386c39217878a9a56d581922ad37ca4
  NDK_VER: 23.2.8568313

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: TDLib 캐시 불러오기
        id: tdcache
        uses: actions/cache/restore@v4
        with:
          path: tdlib-out
          key: tdlib-${{ env.TD_COMMIT }}-arm64-api24-v1

      # 텔레그램 공식 라이브러리를 직접 빌드 (처음 한 번만, 이후는 캐시 사용)
      - name: TDLib 빌드
        if: steps.tdcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf php-cli
          git clone https://github.com/tdlib/td.git td
          cd td
          git checkout "$TD_COMMIT"
          cd example/android
          ./fetch-sdk.sh SDK "$NDK_VER"
          ./build-openssl.sh SDK "$NDK_VER"
          ./build-tdlib.sh SDK "$NDK_VER" '' c++_static Java 24 arm64-v8a
          mkdir -p "$GITHUB_WORKSPACE/tdlib-out/libs" "$GITHUB_WORKSPACE/tdlib-out/java"
          cp tdlib/libs/arm64-v8a/libtdjni.so "$GITHUB_WORKSPACE/tdlib-out/libs/"
          cp -r tdlib/java/. "$GITHUB_WORKSPACE/tdlib-out/java/"

      - name: TDLib 캐시 저장
        if: steps.tdcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tdlib-out
          key: tdlib-${{ env.TD_COMMIT }}-arm64-api24-v1

      - name: TDLib를 앱에 넣기
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp tdlib-out/libs/libtdjni.so app/src/main/jniLibs/arm64-v8a/
          cp -r tdlib-out/java/. app/src/main/java/
          find app/src/main/java/org -name '*.java'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: APK 빌드
        run: |
          gradle :app:assembleRelease --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/telegram-gallery-0.1.${{ github.run_number }}.apk"

      - name: 릴리스 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: 텔레그램 갤러리 0.1.${{ github.run_number }}
          files: out/*.apk
